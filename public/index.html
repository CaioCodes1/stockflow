<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StockFlow - Entrar</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">SF</span> StockFlow</div>
      <p class="auth-subtitle">Controle de estoque para pequenas empresas</p>

      <div class="tabs">
        <button type="button" class="active" data-tab="login">Entrar</button>
        <button type="button" data-tab="register">Criar conta</button>
      </div>

      <div class="alert alert-error" id="alert"></div>

      <!-- Login -->
      <form id="form-login">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" placeholder="voce@empresa.com" />
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-block">Entrar</button>
      </form>

      <!-- Cadastro -->
      <form id="form-register" class="hidden">
        <div class="field">
          <label for="register-name">Nome</label>
          <input type="text" id="register-name" required minlength="3" placeholder="Seu nome" />
        </div>
        <div class="field">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" required autocomplete="email" placeholder="voce@empresa.com" />
        </div>
        <div class="field">
          <label for="register-password">Senha</label>
          <input
            type="password"
            id="register-password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Minimo 8 caracteres, com letra e numero"
          />
        </div>
        <button type="submit" class="btn btn-block">Criar conta</button>
        <!-- Todo cadastro publico nasce como EMPLOYEE. O papel e definido pelo
             servidor - ver auth.service.js. -->
        <p class="demo-hint" style="margin-top: 14px">
          Novas contas sao criadas com o perfil <code>EMPLOYEE</code>.
        </p>
      </form>

      <div class="demo-hint">
        Contas de demonstracao<br />
        <code>admin@stockflow.com</code> / <code>Admin@123</code><br />
        <code>funcionario@stockflow.com</code> / <code>Func@123</code>
      </div>
    </div>

    <script type="module" src="./js/login.js"></script>
  </body>
</html>
